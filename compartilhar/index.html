<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compartilhar | Meu Semestre</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website"><meta property="og:site_name" content="Meu Semestre"><meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://www.meusemestre.com.br/compartilhar">
<meta property="og:title" content="Bora indicar o Meu Semestre pra turma? 💜">
<meta property="og:description" content="Artes e mensagens prontas pra mandar no grupo da facul. Um toque e vai pro WhatsApp.">
<meta property="og:image" content="https://www.meusemestre.com.br/og-compartilhar.png?v=1"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fffaf3"><link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fffaf3;--tx:#1b1340;--tx2:#5b5677;--bd:#efe6da;--indigo:#4f46e5;--wa:#25d366;--menta:#16a36a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:"Plus Jakarta Sans",sans-serif;font-size:24px;margin:8px 0 4px;letter-spacing:-.02em}
.mu{color:var(--tx2);font-size:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;text-decoration:none;color:var(--tx)}
.mark{width:32px;height:32px;border-radius:10px;background:var(--indigo);display:grid;place-items:center}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0}
.tabs a{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:#fff;text-decoration:none;color:var(--tx);font-weight:600;font-size:14px}
.tabs a.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
img.arte{width:100%;border-radius:20px;box-shadow:0 10px 30px rgba(27,19,64,.12);background:#fff}
.msg{white-space:pre-wrap;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:16px 0;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:16px;border:2px solid var(--tx);background:#fff;color:var(--tx);font:700 17px "Plus Jakarta Sans",sans-serif;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;box-shadow:0 5px 0 #1a9e4c}
.ok{color:var(--menta);font-weight:600;font-size:14px;text-align:center;min-height:22px;margin-top:10px}
</style>
</head>
<body><div class="w">
<a class="logo" href="/"><img class="mark" src="/icon.svg" alt="">Meu Semestre</a>
<h1>Espalha pra turma 📣</h1>
<p class="mu">Escolhe uma arte, toca em <b>Enviar no WhatsApp</b> e pronto: imagem e mensagem vão juntinhas.</p>
<nav class="tabs" id="tabs"></nav>
<img class="arte" id="arte" alt="">
<div class="msg" id="msg"></div>
<button class="btn wa" id="enviar">📲 Enviar no WhatsApp com a imagem</button>
<a class="btn" id="baixar" download>⬇️ Baixar imagem</a>
<button class="btn" id="copiar">📋 Copiar mensagem</button>
<a class="btn" id="soTexto" target="_blank" rel="noopener">💬 Só o texto no WhatsApp</a>
<p class="ok" id="ok" aria-live="polite"></p>
</div>
<script>
var BASE = '/compartilhar/', ok = document.getElementById('ok');
fetch(BASE + 'mensagens.json').then(function (r) { return r.json(); }).then(function (dados) {
  var lista = dados.artes, q = new URLSearchParams(location.search).get('k');
  var a = lista.filter(function (x) { return x.chave === q; })[0] || lista[0];
  var img = BASE + a.arquivo + '.jpg';
  document.getElementById('tabs').innerHTML = lista.map(function (x) { return '<a href="?k=' + x.chave + '" class="' + (x === a ? 'on' : '') + '">' + x.nome + '</a>'; }).join('');
  var el = document.getElementById('arte'); el.src = img; el.alt = 'Arte de divulgação: ' + a.nome;
  document.getElementById('msg').textContent = a.msg;
  var bx = document.getElementById('baixar'); bx.href = img; bx.setAttribute('download', 'meu-semestre-' + a.arquivo + '.jpg');
  document.getElementById('soTexto').href = 'https://wa.me/?text=' + encodeURIComponent(a.msg);
  document.getElementById('copiar').onclick = function () { navigator.clipboard.writeText(a.msg).then(function () { ok.textContent = 'Mensagem copiada! 📋'; }); };
  document.getElementById('enviar').onclick = async function () {
    try {
      var blob = await (await fetch(img)).blob();
      var file = new File([blob], 'meu-semestre-' + a.arquivo + '.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.clipboard.writeText(a.msg); } catch (e) { }
        await navigator.share({ files: [file], text: a.msg });
        ok.textContent = 'Foi! Se o texto não aparecer junto, é só colar (já tá copiado) 😉';
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    bx.click();
    window.open('https://wa.me/?text=' + encodeURIComponent(a.msg), '_blank');
    ok.textContent = 'Baixamos a imagem pra você. No WhatsApp, é só anexar junto com a mensagem 😉';
  };
});
</script>
</body>
</html>
